name: Dependabot auto-merge (patch only)

# Auto-merge is enabled ONLY for Dependabot pull requests whose update
# type is semver-patch. Minor and major updates are never auto-merged;
# they stay open for human review (see the weekly patrol report).
#
# Safety note: auto-merge waits for the branch's *required* status
# checks. The "main" ruleset must require the Trivy check, otherwise a
# patch PR would merge immediately without waiting for any check.
#
# pull_request_target is used because workflows triggered by Dependabot
# on plain pull_request events receive a read-only GITHUB_TOKEN. This
# workflow never checks out the pull request's code; it only talks to
# the GitHub API, which is the documented safe pattern for this event.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-patch:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for patch updates only
        # For grouped PRs, fetch-metadata reports the highest update
        # type in the group, so a group auto-merges only when every
        # member is a patch update.
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
