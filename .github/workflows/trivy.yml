name: Trivy Vulnerability Scanner

on:
  # Weekly run: new CVEs are disclosed against unchanged code, so the
  # schedule is what turns Trivy into an upgrade reminder.
  schedule:
    - cron: '0 0 * * 1' # Monday 09:00 JST
  # Otherwise, only run when the scanned surfaces actually change.
  push:
    branches: [ main ]
    paths:
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
      - 'backend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/Dockerfile'
      - '.github/workflows/trivy.yml'
  # Pull requests are intentionally NOT scanned: detection happens on the
  # push to main after merge (and weekly), so PR checks stay clean.
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Run Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # for the failure notification issue below
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        id: scan-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the same images that get deployed, and scan them so base
      # image (OS package) vulnerabilities are caught here as well.
      # Cache is shared with the deploy workflows (type=gha).
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kinun-signal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on backend image
        id: scan-backend-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: kinun-signal-backend:${{ github.sha }}
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kinun-signal-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on frontend image
        id: scan-frontend-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: kinun-signal-frontend:${{ github.sha }}
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Open an issue only when a scan step actually detected
      # vulnerabilities (its exit code fired) — not when the workflow
      # failed for other reasons such as a build error. If an issue with
      # the same title is already open, comment on it instead.
      - name: Open an issue when vulnerabilities are detected
        if: steps.scan-fs.outcome == 'failure' || steps.scan-backend-image.outcome == 'failure' || steps.scan-frontend-image.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failedTargets = [
              ['${{ steps.scan-fs.outcome }}', 'repository (fs) scan'],
              ['${{ steps.scan-backend-image.outcome }}', 'backend image scan'],
              ['${{ steps.scan-frontend-image.outcome }}', 'frontend image scan'],
            ].filter(([outcome]) => outcome === 'failure').map(([, label]) => label);
            const title = '🔒 Trivy scan failed: vulnerabilities need attention';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 30,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Trivy detected vulnerabilities again (${failedTargets.join(', ')}). Latest run: ${runUrl}`,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Trivy detected fixable CRITICAL/HIGH vulnerabilities.',
                  '',
                  `Detected in: ${failedTargets.join(', ')}`,
                  `Run: ${runUrl}`,
                  '',
                  'Check the workflow log for the affected packages, update them, and close this issue once a scan passes again.',
                ].join('\n'),
              });
              core.info(`Created issue #${created.number}`);
            }

      # The scan steps use continue-on-error so that all of them run and
      # the issue step above can fire; fail the job here instead whenever
      # any scan detected vulnerabilities.
      - name: Fail the job if any scan detected vulnerabilities
        if: always() && (steps.scan-fs.outcome == 'failure' || steps.scan-backend-image.outcome == 'failure' || steps.scan-frontend-image.outcome == 'failure')
        run: exit 1
