# Clippy configuration for AI-driven development (kinun-signal)
# Allow unwrap() and expect() inside #[cfg(test)] blocks while denying them in production code via Cargo.toml [lints.clippy].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true

# Keep functions reasonably sized and readable when generated by AI agents
too-many-arguments-threshold = 8
cognitive-complexity-threshold = 30
